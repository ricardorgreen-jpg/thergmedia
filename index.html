<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM Media | Premium Media & Design</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --background: #0a0a0a;
            --accent: #8b5cf6;       /* RM Media Purple */
            --accent-hover: #a78bfa; 
            --card-bg: #141414;
            --card-border: #262626;
        }

        body {
            background-color: var(--background);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Fixing Tailwind to use our Custom Purple */
        .bg-accent { background-color: var(--accent) !important; }
        .text-accent { color: var(--accent) !important; }
        .hover\:text-accent:hover { color: var(--accent) !important; }
        .selection\:bg-accent::selection { background-color: var(--accent); color: white; }

        /* Custom Scrollbar for a premium feel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--background); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>

<body class="antialiased selection:bg-accent selection:text-white">

    <nav class="fixed w-full z-50 bg-black/80 backdrop-blur-md border-b border-white/10 px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-accent flex items-center justify-center font-bold text-white tracking-tighter">RM</div>
            <div>
                <h1 class="font-bold text-xl leading-none tracking-wide">RM MEDIA</h1>
                <p class="text-[10px] text-zinc-500 tracking-widest uppercase mt-1">Est 2018</p>
            </div>
        </a>
        
        <div class="hidden md:flex gap-8 text-sm font-semibold tracking-wide">
            <a href="#services" class="hover:text-accent transition duration-300">Services</a>
            <a href="#portfolio" class="hover:text-accent transition duration-300">Portfolio</a>
            <a href="about.html" class="hover:text-accent transition duration-300">About</a>
            <a href="#contact" class="hover:text-accent transition duration-300">Contact</a>
        </div>

        <div class="flex items-center gap-6">
            <a href="tel:7736270657" class="hidden lg:flex items-center gap-2 text-sm hover:text-accent transition duration-300">
                <i class="fa-solid fa-phone text-zinc-400"></i>
                <span>(773) 627-0657</span>
            </a>
            <a href="#contact" class="bg-white text-black px-6 py-2.5 rounded-full text-sm font-bold hover:bg-zinc-200 transition transform hover:scale-105 active:scale-95 duration-200">
                LET'S CREATE
            </a>
        </div>
    </nav>

    <section class="relative h-screen flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 z-0">
            <div class="absolute inset-0 bg-black/60 z-10"></div>
            <img src="images/Hero.jpg" alt="Studio" class="w-full h-full object-cover">
        </div>

        <div class="relative z-20 text-center px-4">
            <span class="inline-block px-4 py-1.5 rounded-full border border-white/20 text-[10px] uppercase tracking-[0.3em] bg-white/5 backdrop-blur-sm mb-6">
                Chicago Based Creative Studio
            </span>
            <h2 class="text-5xl md:text-8xl font-bold tracking-tighter mb-6">
                WE TELL <br> <span class="text-white/90">YOUR STORY</span>
            </h2>
            <p class="max-w-xl mx-auto text-zinc-400 text-lg mb-10">
                Premium photography, videography, web design and audio production. Creating unforgettable visual experiences since 2018.
            </p>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="#portfolio" class="w-full sm:w-auto bg-white text-black px-8 py-4 rounded-xl font-bold hover:bg-zinc-200 transition flex items-center justify-center gap-2">
                    VIEW OUR WORK <i class="fa-solid fa-play text-[10px]"></i>
                </a>
                <a href="#contact" class="w-full sm:w-auto border border-white/20 hover:border-accent hover:text-accent px-8 py-4 rounded-xl font-bold transition">
                    START A PROJECT
                </a>
            </div>
        </div>
    </section>

</body>
</html>
