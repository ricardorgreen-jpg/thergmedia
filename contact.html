<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | RM Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="antialiased">

    <nav class="p-6 border-b border-white/10 flex justify-between items-center">
        <a href="index.html" class="font-bold text-xl uppercase tracking-tighter">RM Media</a>
        <a href="index.html" class="text-xs uppercase tracking-widest hover:text-purple-400">Back to Home</a>
    </nav>

    <section class="max-w-2xl mx-auto py-32 px-6">
        <h1 class="text-6xl font-bold mb-6 tracking-tighter">Start a Project</h1>
        <p class="text-white/50 mb-12">Fill out the details below and we will get back to you within 24 hours.</p>

        <form id="booking-form" class="space-y-6">
            <div class="grid md:grid-cols-2 gap-6">
                <input type="text" name="name" placeholder="Name" required class="w-full bg-zinc-900 border border-white/10 p-5 rounded-2xl focus:border-purple-500 outline-none transition">
                <input type="email" name="email" placeholder="Email" required class="w-full bg-zinc-900 border border-white/10 p-5 rounded-2xl focus:border-purple-500 outline-none transition">
            </div>

            <select name="service" class="w-full bg-zinc-900 border border-white/10 p-5 rounded-2xl focus:border-purple-500 outline-none transition appearance-none">
                <option>Photography</option>
                <option>Videography</option>
                <option>Web Design</option>
            </select>

            <textarea name="message" rows="6" placeholder="Project Details" required class="w-full bg-zinc-900 border border-white/10 p-5 rounded-2xl focus:border-purple-500 outline-none transition"></textarea>

            <button type="submit" id="submit-btn" class="w-full py-5 bg-white text-black font-bold rounded-2xl hover:bg-purple-600 hover:text-white transition uppercase tracking-widest">Send Message</button>
        </form>

        <div id="success-message" class="hidden text-center p-8 border border-purple-500/30 rounded-2xl bg-zinc-900 shadow-xl shadow-purple-500/5">
            <h3 class="text-purple-400 text-2xl font-bold mb-2">Booking Received!</h3>
            <p class="text-white/50 text-sm">Thank you for reaching out to RM Media. We will review your project details and get back to you within 24 hours.</p>
        </div>
    </section>

    <script>
        const myForm = document.getElementById("booking-form");
        const successBox = document.getElementById("success-message");
        const myButton = document.getElementById("submit-btn");

        myForm.addEventListener("submit", function(event) {
            // Stop the page from reloading or jumping to Formspree's site
            event.preventDefault(); 

            // Put the button into a loading state
            myButton.innerText = "SENDING...";
            myButton.disabled = true;

            // Gather all the text input values automatically
            const packedData = new FormData(myForm);

            // Send the data directly to your Formspree endpoint backend
            fetch("https://formspree.io/f/mgopdbgp", {
                method: "POST",
                body: packedData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    myForm.classList.add("hidden");       // Hide the input fields smoothly
                    successBox.classList.remove("hidden"); // Reveal your clean thank you message
                } else {
                    alert("Oops! Something went wrong on the server. Please try again.");
                    myButton.innerText = "SEND MESSAGE";
                    myButton.disabled = false;
                }
            })
            .catch(error => {
                alert("Error connecting to the network. Check your internet connection.");
                myButton.innerText = "SEND MESSAGE";
                myButton.disabled = false;
            });
        });
    </script>

</body>
</html>
