<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | RM Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --background: #0a0a0a; --accent: #8b5cf6; }
        body { background-color: var(--background); color: #ffffff; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="antialiased">
    <nav class="fixed top-0 left-0 right-0 z-50 bg-black/90 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-9 h-9 bg-gradient-to-br from-purple-500 to-violet-600 rounded-xl flex items-center justify-center">
                    <span class="text-white font-bold text-xl tracking-tighter">RM</span>
                </div>
                <div class="font-semibold text-2xl tracking-tighter">RM MEDIA</div>
            </a>
            <div class="hidden md:flex items-center gap-10 text-xs uppercase tracking-widest font-medium">
                <a href="services.html" class="hover:text-purple-400 transition">Services</a>
                <a href="portfolio.html" class="hover:text-purple-400 transition">Portfolio</a>
                <a href="about.html" class="hover:text-purple-400 transition">About</a>
                <a href="contact.html" class="text-purple-400">Contact</a>
            </div>
        </div>
    </nav>

    <section class="pt-40 pb-24 px-6 max-w-3xl mx-auto">
        <div class="text-center mb-16">
            <h2 class="text-5xl font-bold tracking-tight mb-4">Start a Project</h2>
            <p class="text-white/60">Have a vision? Let’s bring it to life. Fill out the form below and we'll be in touch shortly.</p>
        </div>

        <form action="https://formspree.io/f/mgopdbgp" method="POST" class="space-y-6">
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs uppercase tracking-widest text-white/40 mb-2 ml-1">Name</label>
                    <input type="text" name="name" required class="w-full bg-zinc-900/50 border border-white/10 rounded-2xl px-6 py-4 focus:border-purple-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-white/40 mb-2 ml-1">Email</label>
                    <input type="email" name="email" required class="w-full bg-zinc-900/50 border border-white/10 rounded-2xl px-6 py-4 focus:border-purple-500 outline-none transition">
                </div>
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-white/40 mb-2 ml-1">Project Type</label>
                <select name="type" class="w-full bg-zinc-900/50 border border-white/10 rounded-2xl px-6 py-4 focus:border-purple-500 outline-none transition appearance-none">
                    <option>Photography</option>
                    <option>Videography</option>
                    <option>Web Design</option>
                    <option>Audio Production</option>
                </select>
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-white/40 mb-2 ml-1">Message</label>
                <textarea name="message" rows="5" required class="w-full bg-zinc-900/50 border border-white/10 rounded-2xl px-6 py-4 focus:border-purple-500 outline-none transition"></textarea>
            </div>
            <button type="submit" class="w-full py-5 bg-white text-black rounded-2xl font-bold hover:bg-purple-600 hover:text-white transition-all uppercase tracking-widest text-sm">
                Send Message
            </button>
        </form>
    </section>

    <footer class="border-t border-white/10 py-12 text-center text-xs text-white/40">
        <p>© 2026 RM Media. Made with passion in Chicago.</p>
    </footer>
</body>
</html>
